asset_type: note
id: note_olist_active_customer
kind: business_rule
scope:
- tbl_olist_txns
- tbl_olist_accounts
summary: '"Active customer" means an acct_uid placed an order (txns.purchased_at)
  within the last 90 days of the dataset end date (MAX(purchased_at) from txns, 2020-10-17);
  "churned customer" means no order in the last 180 days from that same end date.
  Use the dataset''s max purchased_at, not the current wall-clock date, as the reference
  point.

  Boundary computation (disambiguated 2026-07-29, Experiment 006 Finding 3): compare
  as a CONTINUOUS elapsed-time difference, not calendar-date truncation. Use julianday(end_date)
  - julianday(purchased_at) <= 90 (or the equivalent exact-timestamp arithmetic in
  your SQL dialect) rather than DATE(end_date, ''-90 days'') <= purchased_at <= DATE(end_date),
  which truncates purchased_at''s time-of-day component and can shift which orders
  fall inside/outside the window at the boundary. Confirmed to produce a different
  customer count than the continuous-day method on this dataset.

  '
triggers: []
activation: always
normative_force: must_honour
confidence: 0.9
