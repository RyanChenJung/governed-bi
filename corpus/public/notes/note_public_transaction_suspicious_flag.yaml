summary: A transaction is flagged as suspicious (sketchy) when its Transaction Anomaly
  Score TAS = (payment_amount / 1000) * (completion_hours / 24) * (1 + escrow_hours/100)
  * (1 - market_escrow_completion_rate/100) exceeds 75, AND the payment method equals
  'Crypto_B', AND escrow was either not used or lasted under 24 hours, AND routing_complexity
  is marked 'Complex'; all four conditions must hold simultaneously.
