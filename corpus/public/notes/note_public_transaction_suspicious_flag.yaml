source_question: 'By "anomaly score" for transactions, which metric would you like
  me to use to rank sketchiness — the fraud probability (riskanalysis.fraudprob),
  the wallet risk score (riskanalysis.wallrisksc), or the security alert confidence
  score (securitymonitoring.alertconfidencescore)? (why: The warehouse has no single
  column literally named "anomaly score" — several risk-related metrics exist across
  riskanalysis and securitymonitoring, and no governed note defines which one (or
  combination) represents "sketchiness" for transactions.)'
